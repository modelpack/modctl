{{ define "main" }}
<main class="container docs-layout" id="main">
  <aside class="docs-sidebar">
    <p class="eyebrow">{{ i18n "gettingStarted" }}</p>
    <div aria-label="{{ i18n "onThisPage" }}">{{ .TableOfContents }}</div>
    <a class="sidebar-source" href="{{ .Site.Params.repository }}/blob/main/docs/getting-started.md" target="_blank" rel="noopener noreferrer">{{ i18n "sourceDocs" }} ↗</a>
  </aside>
  <article class="docs-content">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    <p class="docs-intro">{{ .Params.intro }}</p>
    <div class="docs-note"><span aria-hidden="true">i</span><span>{{ .Params.note }}</span></div>
    <div class="docs-prose">{{ .Content }}</div>
    <div class="docs-end">
      <a href="{{ .Site.Home.RelPermalink }}">← {{ i18n "backHome" }}</a>
      <a href="{{ .Site.Params.repository }}/issues" target="_blank" rel="noopener noreferrer">{{ i18n "improveDocs" }} ↗</a>
    </div>
  </article>
</main>
{{ end }}
